name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag and extract changelog
        run: >-
          python3 scripts/release_notes.py
          --tag "$GITHUB_REF_NAME"
          --output "$RUNNER_TEMP/release-notes.md"

      - name: Test release validation
        run: python3 -m unittest discover -s tests -p 'test_release_notes.py' -v

      - name: Test frontend cards
        run: node tests/test_frontend.cjs

      - name: Test integration with Home Assistant
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            ghcr.io/home-assistant/home-assistant:2026.9.2 \
            -m unittest discover -s tests -v

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "IntuiBase Radio $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
